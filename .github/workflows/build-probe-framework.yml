name: build-probe-framework

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build frameworks
        run: |
          chmod +x build.sh
          ./build.sh "$(git rev-parse --short HEAD)"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frameworks
          path: |
            practice_probe_ci.framework.zip
            practice_bootstrap.framework.zip
            practice_clock_probe.framework.zip
          if-no-files-found: error
